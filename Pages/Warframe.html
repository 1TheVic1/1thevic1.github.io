<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=yes">
    <title>TheVic_1</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon-16x16.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/styling/games_style.css" />
    <link rel="stylesheet" href="/styling/warframe_style.css" />
    <script src="/scripts/wave_script.js" ></script>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script src="/scripts/menu_script.js"></script>
</head>
<body>
    <nav>
        <label class="logo">TheVic_1</label>
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/Pages/Games.html">Games</a></li>
            <li><a href="/Pages/About.html" onclick="this.href='/Pages/404.html'">About</a></li>
            <li><a href="/Pages/Socials.html">Socials</a></li>
        </ul>
        <label id="icon">
            <i class="material-icons">menu</i>
        </label>
    </nav>

    <div id="box-shadow-div">
    </div>

    <img class="waves" style="position: absolute; left:0; right:0;width:100%; top: 0; bottom: 0; height: 100%; z-index: -1;"
        src="/assets/img/Background.png" alt="" />
    <img class="waves1" style="position: absolute; left:0; right:0;width:100%; top: 0; bottom: 0; height: 100%; z-index: -1;"
        src="/assets/img/BackgroundBigTab.png" alt="" />
    <img class="waves2" style="position: absolute; left:0; right:0;width:100%; top: 0; bottom: 0; height: 100%; z-index: -1;"
        src="/assets/img/BackgroundMobile.png" alt="" />

    <div class="SBackground">

        <div class="SDiv2"></div>

        <div class="wf-placeholder">
            <h1>Warframe</h1>
        </div>

        <div class="wf-dash">
            <div class="wf-summary">
                <div class="wf-rank">
                    <span class="wf-label">Mastery Rank</span>
                    <span class="wf-rank-num" id="wfRankNum">-</span>
                    <span class="wf-rank-name" id="wfRankName"></span>
                </div>
                <div class="wf-donut">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <circle class="wf-donut-track" cx="60" cy="60" r="50" />
                        <circle class="wf-donut-fill" id="wfDonutFill" cx="60" cy="60" r="50" />
                    </svg>
                    <div class="wf-donut-centre">
                        <span class="wf-donut-pct" id="wfTotalPct">-</span>
                        <span class="wf-label">Total completion</span>
                        <span class="wf-donut-count" id="wfTotalCount"></span>
                    </div>
                </div>
            </div>
            <div class="wf-cards" id="wfCards"></div>
            <p class="wf-updated" id="wfUpdated"></p>
        </div>

    </div>
    <script src="/scripts/warframe_data.js"></script>
    <script src="/scripts/warframe_page.js"></script>

</body>
</html>
